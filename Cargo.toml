[package]
name = "oauth2"
version = "0.0.5"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
base64-url = "3.0.4"
base64ct = "1.8.3"
chrono = { version = "0.4.45", features = ["serde"] }
ecdsa = "0.17.0"
p256 = "0.14.0"
rand = "0.10.2"
reqwest = { version = "0.13.4", features = ["blocking", "form", "json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
zeroize = "1.9.0"
